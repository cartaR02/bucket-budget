<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bucket Budget — Connecting...</title>
  <style>
    body {
      background: #F8F6F1;
      color: #1A1614;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .msg { text-align: center; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="msg">Finishing bank connection...</div>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <script>
    // Plaid redirects here after OAuth — we need to re-initialize Link
    // with the same link_token to finish the flow
    const linkToken = localStorage.getItem('plaid_link_token');
    // Set when re-authenticating an existing bank (update mode): its token must not be exchanged
    const updateItemId = localStorage.getItem('plaid_update_item_id');
    if (linkToken) {
      const handler = Plaid.create({
        token: linkToken,
        receivedRedirectUri: window.location.href,
        onSuccess: async (publicToken, metadata) => {
          try {
            const res = updateItemId
              ? await fetch(`/api/plaid/items/${encodeURIComponent(updateItemId)}/reconnected`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                })
              : await fetch('/api/plaid/exchange_token', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ public_token: publicToken, metadata }),
                });
            localStorage.removeItem('plaid_update_item_id');
            // A brand-new bank belongs to no pool yet; the app prompts for one on load
            if (res.ok && !updateItemId) localStorage.setItem('plaid_just_linked', '1');
            if (res.ok || res.status === 401) {
              // Go back to the main app (it asks for the password if the session expired)
              window.location.href = '/';
            } else {
              document.querySelector('.msg').textContent = 'Connection failed. Redirecting...';
              setTimeout(() => window.location.href = '/', 2000);
            }
          } catch (err) {
            document.querySelector('.msg').textContent = 'Connection failed. Redirecting...';
            setTimeout(() => window.location.href = '/', 2000);
          }
        },
        onExit: () => {
          localStorage.removeItem('plaid_update_item_id');
          window.location.href = '/';
        },
      });
      handler.open();
    } else {
      document.querySelector('.msg').textContent = 'Session expired. Redirecting...';
      setTimeout(() => window.location.href = '/', 2000);
    }
  </script>
</body>
</html>
