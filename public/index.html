<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bucket Budget</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F8F6F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bucket Budget">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=27">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-logo">
        <span class="header-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></span>
        <h1>Bucket Budget</h1>
      </div>
      <button id="lock-btn" class="btn-small hidden" title="Lock Bucket Budget">Lock</button>
    </div>
  </header>

  <main>
    <!-- Pool Tabs -->
    <nav id="pool-tabs"></nav>

    <!-- Balance Section -->
    <section id="balance-section">
      <div id="balance-display">
        <div class="balance-row">
          <div class="balance-item">
            <span class="balance-label">Total Balance</span>
            <span id="total-balance" class="balance-amount">$0.00</span>
            <button id="edit-balance-btn" class="btn-small">Edit</button>
          </div>
          <div class="balance-item">
            <span class="balance-label">Allocated</span>
            <span id="total-allocated" class="balance-amount secondary">$0.00</span>
          </div>
          <div class="balance-item">
            <span class="balance-label">Unallocated</span>
            <span id="unallocated" class="balance-amount accent">$0.00</span>
          </div>
        </div>
      </div>
      <div id="summary-bar"></div>
      <!-- Plaid Connection (populated by JS based on status) -->
      <div id="plaid-section" class="hidden"></div>
    </section>

    <!-- Bucket Grid -->
    <section id="buckets-section">
      <div class="section-header">
        <h2>Buckets</h2>
        <div class="section-actions">
          <button id="log-deposit-btn" class="btn-secondary hidden">Log Deposit</button>
          <button id="log-purchase-btn" class="btn-secondary">Log Purchase</button>
          <button id="transfer-btn" class="btn-secondary">Transfer</button>
          <button id="new-bucket-btn" class="btn-primary">+ New Bucket</button>
        </div>
      </div>
      <div id="bucket-grid"></div>
      <div id="empty-state" class="hidden">
        <div class="empty-state-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/><path d="M5 6l1.5 14a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2L19 6"/><path d="M5 6h14"/></svg></div>
        <p>No buckets yet. Create your first one to start organizing your money!</p>
      </div>
    </section>

    <!-- Transaction History -->
    <section id="transactions-section">
      <div class="section-header">
        <h2>Recent Transactions</h2>
        <div class="section-actions">
          <button id="manage-rules-btn" class="btn-small">Auto-Assign Rules</button>
        </div>
      </div>
      <div id="transaction-list"></div>
      <div id="transactions-empty" class="hidden">
        <p class="empty-hint">No transactions yet. Log a purchase to see it here.</p>
      </div>
    </section>
  </main>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="hidden">
    <div id="modal" role="dialog" aria-modal="true">
      <div id="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="btn-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <script src="app.js?v=28"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
